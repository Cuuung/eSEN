trainer: mlip_trainer

dataset:
  train:
    format: lmdb
    src: data/pet-med-lmdb/train/mad-train.lmdb
    # TODO: 用真实均值和标准差替换，见下方计算方法
    transforms:
      normalizer:
        energy:
          mean: -154.318921
          stdev: 192.896903
        forces:
          mean: 0
          stdev: 4.311080
  val:
    format: lmdb
    src: data/pet-med-lmdb/val/mad-val.lmdb

logger: tensorboard

outputs:
  energy:
    property: energy
    shape: 1
    level: system
  forces:
    property: forces
    irrep_dim: 1
    level: atom
    train_on_free_atoms: False
    eval_on_free_atoms: False

loss_functions:
  - energy:
      fn: mae
      coefficient: 4
  - forces:
      fn: l2mae
      coefficient: 100

evaluation_metrics:
  metrics:
    energy:
      - mae
    forces:
      - mae
      - cosine_similarity
  primary_metric: forces_mae

hide_eval_progressbar: False

model:
  name: hydra
  pass_through_head_outputs: True
  backbone:
    model: esen_backbone
    num_layers: 2
    max_neighbors: 1000
    cutoff: 6.0
    sphere_channels: 128
    hidden_channels: 128
    lmax: 2
    mmax: 2
    edge_channels: 128
    distance_function: "gaussian"
    num_distance_basis: 10
    regress_forces: True
    direct_forces: False   # esen_mlp_efs_head 通过 autograd 求力
    use_pbc: True
    otf_graph: True
    norm_type: "rms_norm_sh"
    act_type: "grid"
    mlp_type: "grid"
  heads:
    EFS:
      module: esen_mlp_efs_head  # 同时输出 energy + forces

optim:
  batch_size: 512
  eval_batch_size: 512
  load_balancing: atoms
  num_workers: 4
  lr_initial: 0.0004

  optimizer: AdamW
  optimizer_params:
    weight_decay: 0.001
  scheduler: LambdaLR
  scheduler_params:
    lambda_type: cosine
    warmup_epochs: 0.1
    warmup_factor: 0.2
    lr_min_factor: 0.01

  max_epochs: 5
  clip_grad_norm: 100
  ema_decay: 0.999

  eval_every: 500
