trainer: mlip_trainer

dataset:
  train:
    format: lmdb
    src: /data/home/liuxiangjia/fairchem/share/dataset/periodicSystem/MPtrj/lmdb/train
    transforms:
      normalizer:
        energy:
          mean: -188.811416
          stdev: 190.308646
        forces:
          mean: 0.000000
          stdev: 0.807904
        stress:
          mean: 0.956625
          stdev: 38.581393
  val:
    format: lmdb
    src: /data/home/liuxiangjia/fairchem/share/dataset/periodicSystem/MPtrj/lmdb/val
    transforms:
      normalizer:
        energy:
          mean: -190.334354
          stdev: 197.940001
        forces:
          mean: -0.000000
          stdev: 0.809265
        stress:
          mean: 0.969798
          stdev: 39.085265

logger: tensorboard

outputs:
  energy:
    property: energy
    shape: 1
    level: system
  forces:
    property: forces
    irrep_dim: 1
    level: atom
    train_on_free_atoms: False
    eval_on_free_atoms: False
  stress:
    property: stress
    level: system

loss_functions:
  - energy:
      fn: mae
      coefficient: 20
  - forces:
      fn: l2mae
      coefficient: 20
  - stress:
      fn: mae
      coefficient: 5

evaluation_metrics:
  metrics:
    energy:
      - mae
    forces:
      - mae
      - cosine_similarity
    stress:
      - mae
  primary_metric: forces_mae

hide_eval_progressbar: False

model:
  name: hydra
  pass_through_head_outputs: True
  backbone:
    model: esen_backbone
    num_layers: 10
    max_neighbors: 50
    cutoff: 6.0
    sphere_channels: 128
    hidden_channels: 128
    lmax: 3
    mmax: 2
    edge_channels: 192
    distance_function: gaussian
    num_distance_basis: 10
    regress_forces: True
    direct_forces: True
    regress_stress: False
    use_pbc: True
    use_pbc_single: True      # 加这防止某些小晶格导致卡死
    otf_graph: True
    norm_type: rms_norm_sh
    act_type: s2
    mlp_type: grid
  heads:
    energy:                                                                                                           
      module: esen_mlp_energy_head
    forces:                                                                                                           
      module: esen_linear_force_head
    stress:
      module: esen_rank2_head
      output_name: stress
      num_mlp_layers: 2 

optim:
  batch_size: 32
  eval_batch_size: 32
  load_balancing: atoms
  num_workers: 4
  lr_initial: 0.0008

  optimizer: AdamW
  optimizer_params:
    weight_decay: 0.001

  scheduler: LambdaLR
  scheduler_params:
    lambda_type: cosine
    warmup_epochs: 0.1
    warmup_factor: 0.2
    lr_min_factor: 0.01

  max_epochs: 100
  clip_grad_norm: 100
  ema_decay: 0.999
  eval_every: 500

  keep_last_k_checkpoints: 10
