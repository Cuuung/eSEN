trainer: mlip_trainer

dataset:
  val:
    format: lmdb
    src: /data/home/liuxiangjia/fairchem/share/dataset/SPICE-MACE-OFF/test_large_neut_all.lmdb
    use_train_settings: False

logger: tensorboard

outputs:
  energy:
    property: energy
    shape: 1
    level: system
  forces:
    property: forces
    irrep_dim: 1
    level: atom
    train_on_free_atoms: False
    eval_on_free_atoms: False

loss_functions:
  - energy:
      fn: mae
      coefficient: 1
  - forces:
      fn: l2mae
      coefficient: 10

evaluation_metrics:
  metrics:
    energy:
      - mae
    forces:
      - mae
      - cosine_similarity
  primary_metric: forces_mae

hide_eval_progressbar: False

model:
  name: hydra
  pass_through_head_outputs: True
  backbone:
    model: esen_backbone
    num_layers: 4
    max_neighbors: 50
    cutoff: 6.0
    sphere_channels: 128
    hidden_channels: 128
    lmax: 2
    mmax: 2
    edge_channels: 192
    distance_function: gaussian
    num_distance_basis: 10
    regress_forces: True
    direct_forces: True
    regress_stress: False
    use_pbc: False
    use_pbc_single: False
    otf_graph: True
    norm_type: rms_norm_sh
    act_type: s2
    mlp_type: grid
  heads:
    energy:
      module: esen_mlp_energy_head
    forces:
      module: esen_linear_force_head
    stress:
      module: esen_rank2_head
      output_name: stress
      num_mlp_layers: 2

optim:
  batch_size: 32
  eval_batch_size: 32
  load_balancing_on_error: warn_and_no_balance
  num_workers: 4
  lr_initial: 0.0004

  optimizer: AdamW
  optimizer_params:
    weight_decay: 0.001

  scheduler: LambdaLR
  scheduler_params:
    lambda_type: cosine
    warmup_epochs: 0.1
    warmup_factor: 0.2
    lr_min_factor: 0.01

  max_epochs: 1
  clip_grad_norm: 100
  ema_decay: 0.999
