trainer: mlip_trainer

dataset:
  train:
    format: lmdb
    src: /mnt/afs/share/dataset/periodicSystem/MPtrj/lmdb/train
    transforms:
      element_references:
        fit:
          targets: [energy]
          batch_size: 256
          num_batches: 500
      normalizer:
        fit:
          targets: [energy, forces, stress]
          batch_size: 256
          num_batches: 500
  val:
    format: lmdb
    src: /mnt/afs/share/dataset/periodicSystem/MPtrj/lmdb/val

logger: tensorboard

outputs:
  energy:
    property: energy
    shape: 1
    level: system
  forces:
    property: forces
    irrep_dim: 1
    level: atom
    train_on_free_atoms: True
    eval_on_free_atoms: True
  stress:
    property: stress
    level: system

loss_functions:
  - energy:
      fn: per_atom_mae
      coefficient: 20
  - forces:
      fn: l2mae
      coefficient: 20
  - stress:
      fn: mae
      coefficient: 5

evaluation_metrics:
  metrics:
    energy:
      - mae
      - per_atom_mae
    forces:
      - mae
      - forcesx_mae
      - forcesy_mae
      - forcesz_mae
      - cosine_similarity
    stress:
      - mae
  primary_metric: forces_mae

hide_eval_progressbar: False

model:
  name: hydra
  pass_through_head_outputs: True
  backbone:
    model: esen_backbone_dens
    num_layers: 4
    max_neighbors: 300
    cutoff: 6.0
    sphere_channels: 128
    hidden_channels: 128
    lmax: 2
    mmax: 2
    edge_channels: 128
    distance_function: gaussian
    num_distance_basis: 10
    regress_forces: True
    direct_forces: True
    regress_stress: False
    use_pbc: True
    use_pbc_single: True      # 加这防止某些小晶格导致卡死
    otf_graph: True
    norm_type: rms_norm_sh
    act_type: gate
    mlp_type: spectral
    use_envelope: True
  heads:
    energy:                                                                                                           
      module: esen_mlp_energy_head
    forces:                                                                                                           
      module: esen_linear_force_head
    stress:
      module: esen_rank2_head
      output_name: stress
      num_mlp_layers: 2 

optim:
  batch_size: 32
  eval_batch_size: 32
  load_balancing: atoms
  num_workers: 8
  lr_initial: 0.0004

  optimizer: AdamW
  optimizer_params:
    weight_decay: 0.001

  scheduler: LambdaLR
  scheduler_params:
    lambda_type: cosine
    warmup_epochs: 0.1
    warmup_factor: 0.2
    lr_min_factor: 0.01

  max_epochs: 100
  clip_grad_norm: 100
  ema_decay: 0.999
  eval_every: 5000

  keep_last_k_checkpoints: 10
